name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 🔧 在构建前修改 Dockerfile
      - name: Patch Dockerfile to use npm install with China mirror
        run: |
          # 如果 Dockerfile 中有 npm ci，将其替换为 npm install --registry=... 
          # 同时保留原有的其他命令
          sed -i 's/npm ci/npm install --registry=https:\/\/registry.npmmirror.com/g' Dockerfile
          # 如果 Dockerfile 中没有 npm ci，可以尝试添加一行，但一般都会有
          echo "Patched Dockerfile:"
          cat Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
