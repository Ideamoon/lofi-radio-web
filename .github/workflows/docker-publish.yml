name: Build and Push Docker Image

# 1. 触发条件：当代码被推送到 main 分支时触发
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 2. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. 登录到 GitHub Container Registry (GHCR)
      # 使用内置的 GITHUB_TOKEN 进行认证，无需额外设置 Secrets [reference:8]
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 为镜像打上两个标签：latest 和 当前 commit 的 SHA 
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
